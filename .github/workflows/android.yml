# Compila el APK de Android automáticamente en cada push a main.
# El APK queda en: pestaña "Actions" (artefacto) y en "Releases" (descarga directa).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Versión fija: trae Android SDK y Java preinstalados (ubuntu-latest está migrando a Ubuntu 26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar Android SDK
        id: sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "ok=false" >> $GITHUB_OUTPUT; fi

      - name: Instalar Android SDK (solo si falta)
        if: steps.sdk.outputs.ok != 'true'
        uses: android-actions/setup-android@v3

      - name: Comprobar archivos del proyecto
        run: |
          ls -la
          test -f package.json || (echo "❌ package.json no está en la raíz del repositorio. Sube el CONTENIDO de la carpeta fiesta-estelar, no la carpeta." && exit 1)
          test -f www/index.html || (echo "❌ Falta www/index.html" && exit 1)

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: URL web para invitaciones
        run: echo "window.FIESTA_WEB_URL = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';" > www/config.js

      - name: Crear proyecto Android (Capacitor)
        run: |
          rm -rf android
          npx cap add android

      - name: Íconos y pantalla de carga
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2a1b5e' --iconBackgroundColorDark '#2a1b5e' --splashBackgroundColor '#120a2e' --splashBackgroundColorDark '#120a2e'

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FiestaEstelar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FiestaEstelar-apk
          path: FiestaEstelar.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fiesta Estelar v1.0.${{ github.run_number }}
          body: |
            📱 Descarga **FiestaEstelar.apk** e instálalo en tu Android (permite "instalar apps de origen desconocido").
            🌐 Versión web: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: FiestaEstelar.apk
