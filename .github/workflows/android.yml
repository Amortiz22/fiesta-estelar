# Compila el APK de Android automáticamente en cada push a main.
# El APK queda en: pestaña "Actions" (artefacto) y en "Releases" (descarga directa).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: URL web para invitaciones
        run: echo "window.FIESTA_WEB_URL = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';" > www/config.js

      - name: Crear proyecto Android (Capacitor)
        run: npx cap add android

      - name: Íconos y pantalla de carga
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2a1b5e' --iconBackgroundColorDark '#2a1b5e' --splashBackgroundColor '#120a2e' --splashBackgroundColorDark '#120a2e' || echo "Se usan los íconos por defecto"

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FiestaEstelar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FiestaEstelar-apk
          path: FiestaEstelar.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fiesta Estelar v1.0.${{ github.run_number }}
          body: |
            📱 Descarga **FiestaEstelar.apk** e instálalo en tu Android (permite "instalar apps de origen desconocido").
            🌐 Versión web: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: FiestaEstelar.apk
